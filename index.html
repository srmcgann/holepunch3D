<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Play;
      }
      #header, #footer{
        line-height: 32px;
        height: 34px;
        font-size: 32px;
        padding: 0px;
        position: fixed;
        width: 100vw;
        z-index: 100;
      }
      #header{
        background: linear-gradient(-90deg, #444, #444, #333, #333, #111, #111, #111, #111);
        border-bottom: 1px solid #fff4;
      }
      #footer{
        background: linear-gradient(90deg, #444, #444, #333, #333, #111, #111, #111, #111);
        top: calc(100vh - 34px);
        border-top: 1px solid #fff4;
      }
      #headerTitle{
        color: #ba8;
        transform: scale(1.75, 1.0);
        display: inline-block;
        margin-left: 100px;
        font-style: italic;
        font-weight: 900;
        text-shadow: 0px 0px 5px #f00;
      }
      .massMeterContainer{
        width: 318px;
        padding-left: 0!important;
      }
      #massMeter{
        color: #fa4;
      }
      .menuLabel{
        font-size: .4em;
        margin-left: 30px;
        vertical-align: top;
        color: #feb
      }
      .footerElement{
        margin-left: 3px;
        color: #feb;
        background: #000;
        font-size: 14px;
        padding-top: 7px;
        padding-left: 10px;
        padding-right: 10px;
        height: 20px;
        margin-top: 3px;
        line-height: 1em;
        display: inline-block;
        vertical-align: top;
        min-width: 240px;
        border-radius: 5px;
        border-bottom: 1px solid #888;
        border-right: 1px solid #888;
      }
      #massNumeric, #holeCount{
        color: #fa4;
        font-weight: 900;
        padding-left: 0!important;
      }
      .infoContent{
        display: inline-block;
        color: #8fb;
        font-size: 1.25em;
      }
      #launchButton{
        background: #f80;
        color: #fff;
        border-top: 2px solid #db8;
        border-left: 2px solid #db8;
        border-right: 3px solid #543;
        border-bottom: 3px solid #543;
        text-shadow: 2px 2px 2px #120;
      }
      .footerButton{
        vertical-align: top;
        font-family: Play;
        font-size: 20px;
        margin-top: 5px;
        margin-left: 10px;
        border-radius: 10px;
        min-width: 80px;
        line-height: .85em;
        padding-bottom: 3px;
        cursor: pointer;
        background: #864;
        color: #fff;
        border-top: 2px solid #db8;
        border-left: 2px solid #db8;
        border-right: 3px solid #543;
        border-bottom: 3px solid #543;
        text-shadow: 2px 2px 2px #120;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div id="headerTitle">HOLEPUNCH 3D</div>
    </div>
    <div id="footer">
      <div class="footerElement" >
        LEVEL
        <div
          id="levelName"
          class="infoContent"
        ></div>
      </div>
      <span class="menuLabel">
        MASS
      </span>
      <div class="footerElement massMeterContainer" >
        <div
          id="massMeter"
          class="infoContent"
        ></div>
      </div>
      <div class="footerElement" style="min-width: unset">
        <div
          class="infoContent"
          id="massNumeric"
        ></div>
      </div>
      <span class="menuLabel">
        HOLES
      </span>
      <div class="footerElement holeCountContainer" style="min-width: unset" >
        <div
          id="holeCount"
          class="infoContent"
        ></div>
      </div>
      <button
        class="footerButton"
        id="launchButton"
        onclick="window.Launch()"
        onmouseover="window.hovering = true"
        onmouseout="window.hovering = false"
        title="Launch"
      >
        LAUNCH
      </button>
      <button
        class="footerButton"
        onclick="window.Reset()"
        onmouseover="window.hovering = true"
        onmouseout="window.hovering = false"
        title="remove all black holes"
      >
        RESET
      </button>
      <button
        class="footerButton"
        onclick="window.Undo()"
        onmouseover="window.hovering = true"
        onmouseout="window.hovering = false"
        title="undo last placement"
      >
        UNDO
      </button>
    </div>
    <script type="module">

      import * as Coordinates from
      "https://cantelope42.github.io/tempppppp/coordinates.js?3"
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"

      var rendererOptions = {
        ambientLight: .5, margin: 10, fit: 'cover',
        fov: 900, width: 1920, height: 1080,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)

      rendererOptions.context = {
        mode: '2d'
      }
      rendererOptions.attachToBody = true
      var scratchCanvas = await Coordinates.Renderer(rendererOptions)
      var c = scratchCanvas.c
      var ctx = scratchCanvas.ctx
      var w = c.width = renderer.c.width
      var h = c.height = renderer.c.height
      
      //var refTexture = 'https://srmcgann.github.io/skyboxes2/HDRI/stars.jpg'
      //var refTexture = 'https://i.imgur.com/Ad8pyZy.mp4'
      var refTexture = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/pathway_morning.jpg'
      
      var showBackground = true

      
      var HUD = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/HUD_teal.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        HUD.src = URL.createObjectURL(data)
      })
      
      var HUD_dead = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/HUD_red.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        HUD_dead.src = URL.createObjectURL(data)
      })
      
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var x, y, z, p, q, d
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .33}},
        { uniform: {
          type: 'phong',
          value: .6
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          value: .1
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .2}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var cursorBoundingShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .5}},
        { uniform: {
          type: 'phong',
          value: .4
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          value: .3
        } },
      ]
      var shipShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: 1.5}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var blackholeShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .85}},
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .2}},
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var cubeGridShader = await Coordinates.BasicShader(renderer, shaderOptions)
      
      
      var axisLength = 50
      var iLc = axisLength*3 + 1e3
      var colors = []
      Array(iLc).fill().map((v, i) => {
        var rgb   = Coordinates.HSVToRGB(360/iLc*i, 1, 1)
        var red   = rgb[0] / 256
        var green = rgb[1] / 256
        var blue  = rgb[2] / 256
        colors.push(red, green, blue, 1)
      })
      
      var shaderOptions = [
        { attribute: {
          type: 'custom',
          enabled: true, 
          value: colors,
          name: 'customColors',
          stride: 4,
          dataType: renderer.ctx.FLOAT,
          vertDeclaration: `
            attribute vec4 customColors;
            varying vec4 attribCols;
          `,
          vertCode:        `
            attribCols = customColors;
          `,
          fragDeclaration: `
            varying vec4 attribCols;
          `,
          fragCode: `
            mixColor = attribCols;
          `,
        }},
      ]
      var linesShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var iSmokec = 5e3
      var iSmokev = .04
      var particleColors = []
      Array(iSmokec).fill().map((v, i) => {
        var rgb   = Coordinates.HSVToRGB(360/iSmokec*i, 1, 1)
        var red   = rgb[0] / 256
        var green = rgb[1] / 256
        var blue  = rgb[2] / 256
        colors.push(red, green, blue, 1)
      })
      
      var shaderOptions = [
        { attribute: {
          type: 'custom',
          enabled: true, 
          value: particleColors,
          name: 'customColors',
          stride: 4,
          dataType: renderer.ctx.FLOAT,
          vertDeclaration: `
            attribute vec4 customColors;
            varying vec4 attribCols;
          `,
          vertCode:        `
            attribCols = customColors;
          `,
          fragDeclaration: `
            varying vec4 attribCols;
          `,
          fragCode: `
            mixColor = attribCols;
          `,
        }},
      ]
      var particleShader = await Coordinates.BasicShader(renderer, shaderOptions)
      


      var shapes = []

      if(showBackground){
        var geoOptions = {
          shapeType: 'dodecahedron',
          name: 'background',
          sphereize: 1,
          subs: 4,
          map: showBackground ? refTexture : '',
          size: 5e3,
          colorMix: 0,
        }
        await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
          shapes.push(geometry)
          await backgroundShader.ConnectGeometry(geometry)
        })
      }
      
      var geoOptions = {
        shapeType: 'obj',
        url: 'https://srmcgann.github.io/holepunch3D/cubeGrid.obj',
        map: 'https://srmcgann.github.io/holepunch3D/cubegrid.png',
        name: 'cube grid',
        disableDepthTest: true,
        alpha: .9,
        scaleX: 1e3,
        scaleY: 1e3,
        scaleZ: 1e3,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await cubeGridShader.ConnectGeometry(geometry)
      })  
      
      var pointArray = Array(10).fill().map((v,i)=>[0,0,0])
      var cbVerts
      var cbSize = 1
      var geoOptions = {
        shapeType: 'dodecahedron',
        subs: 2,
        sphereize: 1,
        name: 'cursor bounding',
        disableDepthTest: true,
        alpha: .5,
        size: 10,
        colorMix: .025,
        color: 0xff8800,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        cbVerts = structuredClone(geometry.vertices)
        Coordinates.ShapeFromArray(geometry, pointArray).then(async res => {
          for(var i = 0; i < res.vertices.length; i+= res.stride){
            var ls = 1 + i/res.stride*cbSize
            for(var j = 0; j < res.stride; j+=3){
              var idx = j + i
              x = res.vertices[idx+0] *= ls
              y = res.vertices[idx+1] *= ls
              z = res.vertices[idx+2] *= ls
              //console.log(x,y,z)
              res.vstate[idx+0] *= ls
              res.vstate[idx+1] *= ls
              res.vstate[idx+2] *= ls
            }
          }
          shapes.push(res)
          await cursorBoundingShader.ConnectGeometry(geometry)
        })
      })

      
      
      var pointArray = []
      var rad = 100
      var iPc = 100
      Array(iPc).fill().map((v, i) => {
        var ls = Rn() ** .5 * rad
        if(0){
          x = S(p=Math.PI*2*Rn())*S(q=Rn()<.5?Math.PI/2*Rn()**.5:Math.PI-Math.PI/2*Rn()**.5) * ls
          y = C(q) * ls
          z = C(p) * S(q) * ls
        }else{
          x = 1e5
          y = 1e5
          z = 1e5
        }
        pointArray.push([x,y,z])
      })
      
      var blackholeDiskVerts
      var uvs = []
      var normals = []
      var vertices = []
      var normalVecs = []
      var ls = 2.6
      var sd = 10
      for(var i = 0; i < sd*9; i+=3){
        var j = i/3
        var x1 = S(p=Math.PI*2/sd*j + Math.PI/sd) * ls
        var y1 = C(p) * ls
        var z1 = 0
        var x2 = S(p=Math.PI*2/sd*(j+1) + Math.PI/sd) * ls
        var y2 = C(p) * ls
        var z2 = 0
        var x3 = 0
        var y3 = 0
        var z3 = 0
        vertices.push(x1,y1,z1, x2,y2,z2, x3,y3,z3)
        normalVecs.push(0,0,-1, 0,0,-1, 0,0,-1 )
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        uvs.push(0,0,0,0,0,0)
      }
      
      var geometryData = {
        normalVecs,
        vertices,
        normals,
        uvs,
      }
      var geoOptions = {
        shapeType: 'custom shape',
        geometryData,
        name: 'blackhole disk',
        color: 0x000000,
        colorMix: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        for(var i = 0; i < geometry.vertices.length; i += 3){
          x = geometry.vertices[i+0]
          y = geometry.vertices[i+1]
          z = geometry.vertices[i+2]
          //geometry.vertices[i+0] = x - .1
          //geometry.vertices[i+1] = y + .1
          geometry.vertices[i+2] = z + .08
        }
        blackholeDiskVerts = structuredClone(geometry.vertices)
        Coordinates.ShapeFromArray(geometry, pointArray).then(async res => {
          shapes.push(res)
          await blackholeShader.ConnectGeometry(res)
        })
      })
      
      var lines = []
      var geometryData = []
      var linesShape
      Array(iLc).fill().map((v, i) => {
        geometryData.push([1e5,1e5,1e5],[1e5,1e5,1e5])
      })
      var geoOptions = {
        shapeType: 'lines',
        name: 'lines',
        geometryData,
        alpha: .5,
        penumbra: .33,
        size: 15,
        color: 0xff8800,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        linesShape = geometry
        await linesShader.ConnectGeometry(geometry)
      })

      var smoke
      var geoOptions = {
        shapeType: 'particles',
        name: 'smoke particles',
        geometryData: Array(iSmokec).fill().map(v=>[1e5,1e5,1e5]),
        alpha: 1,
        disableDepthTest: true,
        penumbra: .5,
        size: 16,
        color: 0xffbb88,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await particleShader.ConnectGeometry(geometry)
      })
      
      
      const SpawnSmoke = (x, y, z) => {
        var vx = S(p=Math.PI*2*Rn()) * S(q=Rn()<.5?Math.PI/2*Rn()**.5:Math.PI-Math.PI/2*Rn()**.5) * iSmokev
        var vy = C(q) * iSmokev
        var vz = C(p) * S(q) * iSmokev
        smoke.push({ x, y, z, vx, vy, vz, life: 1 })
      }

      /*
      var particles = []
      var geometryData = []
      var iParticlesc = 50
      var bars = 20
      var ls = 60
      var sp = ls/8
      for(j = 0; j < bars; j ++){
        Array(iParticlesc).fill().map((v, i) => {
          x = S(p=Math.PI*2/iParticlesc*i) * ls
          y = C(p) * ls
          z = (-bars/2 + j + .5) * sp
          var vx = 0
          var vy = 0
          var vz = 0
          geometryData.push([x,y,z])
          particles.push({ x, y, z, vx, vy, vz, ox: x, oy: y, oz: z })
        })
      }
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        geometryData,
        alpha: .8,
        penumbra: .33,
        size: 5,
        color: 0xff8800,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      */
      
      var cursor
      var geoOptions = {
        shapeType: 'sprite',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
        name: 'cursor',
        size: 20,
        colorMix: 0,
        disableDepthTest: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        cursor = geometry
        shapes.push(geometry)
      })
      
      /*
      var geoOptions = {
        shapeType: 'octahedron',
        sphereize: 1,
        subs: 1,
        name: 'test marker',
        rotationMode: 2,
        size: 5,
        color: 0xff0000,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        await Coordinates.ShapeToLines(geometry).then(res => {
          res.shape.rotationMode = 2
          res.shape.name = 'test marker'
          res.shape.color = 0x00ffff
          shapes.push(res.shape)
        })
      })
      */
      
      var geoOptions = {
        shapeType: 'obj',
        url: 'https://srmcgann.github.io/holepunch3D/ship.obj?2',
        map: 'https://srmcgann.github.io/holepunch3D/ship.png',
        name: 'ship',
        rotationMode: 2,
        scaleX: 3,
        scaleY: 3,
        scaleZ: 3,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shipShader.ConnectGeometry(geometry)
      })
      
      var blackholeVerts
      var geoOptions = {
        shapeType: 'rect',
        map: 'https://srmcgann.github.io/holepunch3D/blackhole_new.png',
        name: 'blackhole',
        alpha: .9,
        disableDepthTest: true,
        scaleY: -1,
        size: 10,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        blackholeVerts = structuredClone(geometry.vertices)
        var cyls = shapes.filter(shape => shape.name == 'blackhole disk')[0].shapeData
        Coordinates.ShapeFromArray(geometry, pointArray).then(async res => {
          res.shapeData.map((subShape, sIdx) => {
            var roll = Rn() * Math.PI*2
            subShape.roll = roll
            cyls[sIdx].roll = roll
          })
          shapes.push(res)
          await blackholeShader.ConnectGeometry(res)
        })
      })

      var misplacedVerts, misplacedShape
      var geoOptions = {
        shapeType: 'sprite',
        map: 'https://srmcgann.github.io/holepunch3D/misplaced.png?2',
        name: 'misplaced',
        //disableDepthTest: true,
        scaleY: -1,
        size: 25,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        misplacedVerts = structuredClone(geometry.vertices)
        misplacedShape = geometry
      })
      
      var iTargc = 10
      var targets = []
      var targetsShape
      var pointArray = []
      Array(iTargc).fill().map(v => {
        pointArray.push([x=1e5,y=1e5,z=1e5])
      })
      
      const SpawnTarget = (x, y, z, vx=0, vy=0, vz=0) => {
        targets.push({ x, y, z, vx, vy, vz })
      }
      
      var geoOptions = {
        shapeType: 'sprite',
        map: 'https://srmcgann.github.io/holepunch3D/target.png',
        name: 'target',
        size: 50,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        targetsShape = geometry
        shapes.push(geometry)
        if(0)Coordinates.ShapeFromArray(geometry, pointArray).then(res => {
          targetsShape = res
          shapes.push(res)
        })
      })
      


      const LoadFPS = () => {
        Coordinates.LoadFPSControls(renderer, {
          flyMode: true,
          mSpeed: 15,
          crossharSel: 2,
          crosshairSize: .5,
          showCrosshair: false,
        })
      }

      var accel
      var maxDist = 1e3
      const DoKeys = () => {
        accel = keys[16] ? 3 : 1
        keys.map((state, key) => {
          if(state){
            
            switch(key){
              case 87: //w
                if(renderer.cameraMode != 'fps'){
                  renderer.z -= 1 * accel
                  renderer.z = Math.max(10, renderer.z)
                }
              break
              case 65: //a
                if(renderer.cameraMode != 'fps'){
                  renderer.yaw -= .025 * accel
                }
              break
              case 83: //s
                if(renderer.cameraMode != 'fps'){
                  renderer.z += 1 * accel
                  renderer.z = Math.min(maxDist, renderer.z)
                }
              break
              case 68: //d
                if(renderer.cameraMode != 'fps'){
                  renderer.yaw += .025 * accel
                }
              break
              case 37: // left arrow
                renderer.yaw += .025 * accel
              break
              case 38: // up arrow
                renderer.pitch -= .025 * accel
                if(renderer.cameraMode != 'fps'){
                  renderer.pitch = Math.min(1, Math.max(-1, renderer.pitch))
                }
              break
              case 39: // right arrow
                renderer.yaw -= .025 * accel
              break
              case 40: // down arrow
                renderer.pitch += .025 * accel
                if(renderer.cameraMode != 'fps'){
                  renderer.pitch = Math.min(1, Math.max(-1, renderer.pitch))
                }
              break
            }
          }
        })
      }
      
      var misplaced = {
        timer: 0, x: 1e5, y: 1e5, z: 1e5
      }
      const SpawnBlackHole = () => {
        if(massAvailable >= 10){
          addingMass = true
          blackholes[bhIdx].x = cursor.x
          blackholes[bhIdx].y = cursor.y
          blackholes[bhIdx].z = cursor.z
          blackholes[bhIdx].mass = 10
          massAvailable -= 10
        }else{
          misplaced.timer = renderer.frameCount/60 + 1
          misplaced.x = cursor.x
          misplaced.y = cursor.y
          misplaced.z = cursor.z
        }
      }
      
      window.Launch = () => {
        UnloadFPSControls()
        if(!launched){
          launched = true
          document.querySelector('#launchButton').style.background='#800'
          document.querySelector('#launchButton').style.color='#f88'
          document.querySelector('#launchButton').innerHTML = 'ABORT'
          document.querySelectorAll('.footerButton').forEach(el => {
            if(el.id != 'launchButton') el.style.display = 'none'
          })
        }else{
          LevelReset()
        }
      }
      
      const LevelReset = () => {
        document.querySelector('#launchButton').style.background='#f80'
        document.querySelector('#launchButton').style.color='#fff'
        document.querySelector('#launchButton').innerHTML = 'LAUNCH'
        document.querySelectorAll('.footerButton').forEach(el => {
          el.style.display = 'inline-block'
        })
        LoadLevel(level)
      }
      
      const UnloadFPSControls = async (renderer) => {
        renderer.cameraMode     = 'default'
        renderer.showCrosshair  = false
        renderer.useFPSControls = false
      }
      
      var hasMouse = true
      var cursorDist
      var bhIdx, keys, keyTimers
      var ship, shipView, addingMass
      var launched, massAvailable, alive
      var level, showHUD, unDid
      
      const Init = () => {
        level = 1
        showHUD = true
        keys = Array(128).fill(false)
        keyTimers = Array(128).fill(false)
        window.onkeyup = e => {
          if(e.keyCode == 13){
            if(addingMass){
              bhIdx++
              bhIdx%=iPc
              addingMass = false
            }
          }
          keys[e.keyCode] = false
        }
        
        window.onmouseup = e => {
          if(addingMass){
            bhIdx++
            bhIdx%=iPc
          }
          addingMass = false
        }
        
        window.onmousedown = e => {
          if(!window.hovering &&
             e.button == 0 && renderer.cameraMode != 'fps') {
            if(alive && !launched) SpawnBlackHole()
          }
        }
        
        window.onkeydown = e => {
          console.log(e.keyCode)
          keys[e.keyCode] = true
          if(e.keyCode == 79){
            shipView = !shipView
            if(shipView && renderer.cameraMode != 'fps'){
              LoadFPS()
              //renderer.useKeys = false
            }
          }
          if(e.keyCode == 72) showHUD = !showHUD
          if(e.keyCode == 32) {
            if(alive && !launched){
              if(blackholes.filter(v=>v.x!=1e5).length) Launch()
            }else{
              LevelReset()
            }
          }
          if(e.keyCode == 77){
            if(renderer.cameraMode == 'fps'){
              UnloadFPSControls()
              renderer.x = renderer.y = 0
              renderer.z = 20
              renderer.cameraMode = 'default'
            }else{
              LoadFPS()
            }
          }
          if(e.keyCode == 13) {
            if(!addingMass) SpawnBlackHole()
          }
        }
        window.onmousewheel = e => {
          cursorDist -= e.deltaY / 100
        }
        window.onmouseout = () => {
          hasMouse = false
        }
        window.onmouseover = () => {
          hasMouse = true
        }
      }
      Init()
      
      const InitBlackHoles = () => {
        massAvailable = 100
        blackholes = Array(iPc).fill().map(v => {
          x = 1e5
          y = 1e5
          z = 1e5
          return { x, y, z, mass: 10 }
        })
      }
      
      var levelName
      var levelNameEl = document.querySelector("#levelName")
      var massEl = document.querySelector("#massMeter")
      var massNumericEl = document.querySelector("#massNumeric")
      var holeCountEl = document.querySelector("#holeCount")
      var blackholes
      const LoadLevel = level => {
      
        smoke = []
        unDid = false
        window.hovering = false
        InitBlackHoles()
        var shipShape = shapes.filter(v=>v.name == 'ship')[0]
        shipShape.x = 0
        shipShape.y = 0
        shipShape.z = 0
        shipShape.roll = 0
        shipShape.pitch = 0
        shipShape.yaw = 0
        
        ship = {
          x: 0,
          y: 0,
          z: 0,
          vx: 0,
          vy: 0,
          vz: 0,
          vecx: 0,
          vecy: 0,
          vecz: 0,
          vecRoll: 0,
          vecPitch: 0,
          vecYaw: 0,
        }
        
        renderer.useKeys = true
        alive = true
        launched = false
        addingMass = false
        bhIdx = 0
        shipView = false
        switch(level) {
          case 1:
            levelName = 'FLIGHT TRAINING'
            cursorDist = 20
            targets = []
            SpawnTarget(100, 20, 50)
            //renderer.yaw = -.5
            renderer.x = 0
            renderer.y = 0
            renderer.z = 40
            renderer.yaw = 0
            renderer.pitch = 0
            renderer.roll = 0
          break
        }
        
        levelNameEl.innerHTML = levelName
      }
      LoadLevel(level)

      const ProcessScratchCanvas = () => {
      
        ctx.clearRect(0,0,w,h)
        if(hasMouse){
          ctx.fillStyle= '#f00'
          var s = 10
          var mx = renderer.mouseX
          var my = renderer.mouseY
          ctx.fillRect(mx-s/2,my-s/2,s,s)
          
          
          if(!window.hovering && !document.pointerLockElement){
            var rx, ry, rz
            var fps = renderer.cameraMode == 'fps'
            var fac = 1/renderer.fov*100
            if(renderer.cameraMode == 'fps'){
              var mag = fac / (1/(cursorDist/10))
              x = (mx - w/2) * mag
              y = -(my - h/2) * mag
              z = 50 / fac * mag
              p = Math.atan2(y, z) - renderer.pitch
              d = Math.hypot(y, z)
              y = S(p) * d
              z = C(p) * d
              p = Math.atan2(x, z) - renderer.yaw
              d = Math.hypot(x, z)
              x = S(p) * d
              z = C(p) * d
              
              rx = renderer.x
              ry = renderer.y
              rz = renderer.z
              cursor.x = x - rx
              cursor.y = y - ry 
              cursor.z = z - rz
            }else{
              var mag = fac / (1/(cursorDist/10))

              var rx = 0
              var ry = 0
              var rz = renderer.z/(1+fac)
              p = Math.atan2(ry, rz) + renderer.pitch
              d = Math.hypot(ry, rz)
              ry = S(p) * d
              rz = C(p) * d
              p = Math.atan2(rx, rz) - renderer.yaw
              d = Math.hypot(rx, rz)
              rx = S(p) * d
              rz = C(p) * d

              
              x = (mx - w/2) * mag
              y = -(my - h/2) * mag
              z = 50 / fac * mag
              p = Math.atan2(y, z) + renderer.pitch
              d = Math.hypot(y, z)
              y = S(p) * d
              z = C(p) * d
              p = Math.atan2(x, z) - renderer.yaw
              d = Math.hypot(x, z)
              x = S(p) * d
              z = C(p) * d
              
              cursor.x = x - rx
              cursor.y = y - ry 
              cursor.z = z - rz

            }
            
            /*
            var shape = shapes.filter(v=>v.name == 'test marker')
            if(shape.length){
              var rx = 0
              var ry = 0
              var rz = renderer.z/(1+fac)
              p = Math.atan2(ry, rz) - renderer.pitch
              d = Math.hypot(ry, rz)
              ry = S(p) * d
              rz = C(p) * d
              p = Math.atan2(rx, rz) + renderer.yaw
              d = Math.hypot(rx, rz)
              rx = S(p) * d
              rz = C(p) * d

              shape = shape[0]
              shape.x = rx
              shape.y = ry
              shape.z = rz
              shape.pitch = renderer.pitch
              shape.yaw = -renderer.yaw
            }
            */
            
            var ct = 0
            var colors = linesShape.shader.datasets[0].optionalAttributes[0].value
            for(var m = 0; m < 3; m++){
              var red, green, blue
              switch(m){
                case 0:
                  red = 1
                  green = 0
                  blue = 0
                break
                case 1:
                  red = 0
                  green = 1
                  blue = 0
                break
                case 2:
                  red = 0
                  green = 0
                  blue = 1
                break
              }
              for(var i = 0; i < 50; i++){
                var x1 = cursor.x
                var y1 = cursor.y
                var z1 = cursor.z
                var x2 = cursor.x
                var y2 = cursor.y
                var z2 = cursor.z
                var a = [i / 50 * axisLength-axisLength/2, 0, 0,
                     (i+1) / 50 * axisLength-axisLength/2, 0, 0]
                var ar = Coordinates.GetShaderCoord(x1 + a[m%3],
                                     y1 + a[(m+1)%3], z1 + a[(m+2)%3],
                                     linesShape,renderer)
                if(ar){
                  linesShape.vertices[ct + 0] = -x1 - a[m%3]
                  linesShape.vertices[ct + 1] = y1 + a[(m+1)%3]
                  linesShape.vertices[ct + 2] = z1 + a[(m+2)%3]
                  linesShape.vertices[ct + 3] = -x2 - a[(m%3)+3]
                  linesShape.vertices[ct + 4] = y2 + a[((m+1)%3)+3]
                  linesShape.vertices[ct + 5] = z2 + a[((m+2)%3)+3]
                  
                  for(var j=3;j--;){
                    for(var k = 6; k--;){
                      var idx = ct/6*24 + k*4
                      colors[idx + 0] = red
                      colors[idx + 1] = green
                      colors[idx + 2] = blue
                      colors[idx + 3] = 1
                    }
                  }
                }else{
                  linesShape.vertices[ct + 0] = 1e5
                  linesShape.vertices[ct + 1] = 1e5
                  linesShape.vertices[ct + 2] = 1e5
                  linesShape.vertices[ct + 3] = 1e5
                  linesShape.vertices[ct + 4] = 1e5
                  linesShape.vertices[ct + 5] = 1e5
                }
                ct += 6
              }
            }
          }else{
            for(i = 0; i < linesShape.vertices.length; i += 3){
              linesShape.vertices[i+0] = 1e5
              linesShape.vertices[i+1] = 1e5
              linesShape.vertices[i+2] = 1e5
            }
          }
        }
      }
      
      window.Reset = () => {
        if(!launched) InitBlackHoles()
      }
      
      window.Undo = () => {
        if(!launched && bhIdx > 0) {
          blackholes[bhIdx-1].x = 1e5
          blackholes[bhIdx-1].y = 1e5
          blackholes[bhIdx-1].z = 1e5
          massAvailable += blackholes[bhIdx-1].mass
          blackholes[bhIdx-1].mass = 10
          unDid = true
        }
      }
      
      var homing = 100
      var drag = 1
      var grav = 10
      window.Draw = () => {
        var t = renderer.frameCount/60
        
        DoKeys()
        ProcessScratchCanvas()
        
        levelNameEl.innerHTML = levelName + ('.').repeat((t*6|0)%12)
        massEl.innerHTML =('▐').repeat(massAvailable/4)
        massNumericEl.innerHTML = massAvailable
        holeCountEl.innerHTML = blackholes.filter(v=>v.x != 1e5).length
        
        if(0 && !(renderer.frameCount%10)){
          var tx, ty, tz
          for(var i = 0; i < particles.length; i ++){
            var p1 = particles[i]
            var p2 = particles[(i+1)%particles.length]
            
            if(!i){
              tx = p1.ox
              ty = p1.oy
              tz = p1.oz
            }
            if(i < particles.length - 1){
              p1.ox = p2.ox
              p1.oy = p2.oy
              p1.oz = p2.oz
            }else{
              p1.ox = tx
              p1.oy = ty
              p1.oz = tz
            }
            
          }
        }
        
        renderer.Clear()
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              shape.x = -renderer.x
              shape.y = -renderer.y
              shape.z = -renderer.z
              //shape.color = 0xffffff
              //shape.colorMix = 1
              renderer.Draw(shape)
            break
            case 'smoke particles':
              var colors = shape.shader.datasets[0].optionalAttributes[0].value
              for(var i = 0; i < shape.vertices.length; i += 3){
                var idx = i/3
                if(idx < smoke.length){
                  shape.vertices[i+0] = smoke[idx].x += smoke[idx].vx
                  shape.vertices[i+1] = smoke[idx].y += smoke[idx].vy
                  shape.vertices[i+2] = smoke[idx].z += smoke[idx].vz
                  smoke[idx].life -= .005
                  
                  var cIdx = i/3*4
                  var rgb = Coordinates.HSVToRGB(360/smoke.length*(smoke.length-idx)*.2,1,1)
                  colors[cIdx+0] = rgb[0] / 256
                  colors[cIdx+1] = rgb[1] / 256
                  colors[cIdx+2] = rgb[2] / 256
                  colors[cIdx+3] = .2 / smoke.length * idx
                }else{
                  shape.vertices[i+0] = 1e5
                  shape.vertices[i+1] = 1e5
                  shape.vertices[i+2] = 1e5
                }
              }
              smoke = smoke.filter((v, i) =>v.life>0 && smoke.length-iSmokec)
              renderer.Draw(shape)
            break
            case 'particles':
              for(var i = 0; i < shape.vertices.length; i += 3){
                var j = i/3
                if(j < particles.length){
                  particles[j].vx += (particles[j].ox - particles[j].x) / homing
                  particles[j].vy += (particles[j].oy - particles[j].y) / homing
                  particles[j].vz += (particles[j].oz - particles[j].z) / homing
                  
                  var x1 = particles[j].x
                  var y1 = particles[j].y
                  var z1 = particles[j].z
                  blackholes.map((v, i) => {
                    if(v.x != 1e5){
                      var x2 = v.x
                      var y2 = v.y
                      var z2 = v.z
                      d = 2+(Math.hypot(x2-x1, y2-y1, z2-z1))**3/1e4
                      particles[j].vx += (x2-x1) / d * grav
                      particles[j].vy += (y2-y1) / d * grav
                      particles[j].vz += (z2-z1) / d * grav
                    }
                  })
                  
                  x = particles[j].x += particles[j].vx /= drag
                  y = particles[j].y += particles[j].vy /= drag
                  z = particles[j].z += particles[j].vz /= drag
                  shape.vertices[i+0] = x
                  shape.vertices[i+1] = y
                  shape.vertices[i+2] = z
                }else{
                  shape.vertices[i+0] = 1e5
                  shape.vertices[i+1] = 1e5
                  shape.vertices[i+2] = 1e5
                }
              }
              renderer.Draw(shape)
            break
            case 'blackhole':
              if(addingMass){
                if(massAvailable > 0) {
                  massAvailable --
                  blackholes[bhIdx].mass ++
                }
              }
              var disk = shapes.filter(v=>v.name =='blackhole disk')[0]
              for(var i = 0; i < disk.vertices.length; i += disk.stride){
                var sIdx = i/disk.stride
                var el = blackholes[i/disk.stride]
                if(el.x != 1e5){
                  var subShape = disk.shapeData[sIdx]
                  var ox = subShape.ox
                  var oy = subShape.oy
                  var oz = subShape.oz
                  var ls = (el.mass + 1) / 10
                  for(var j = 0; j < disk.stride; j +=3){
                    var idx = i + j
                    x = disk.vstate[idx+0] = blackholeDiskVerts[j+0] * ls + ox
                    y = disk.vstate[idx+1] = blackholeDiskVerts[j+1] * ls + oy
                    z = disk.vstate[idx+2]= blackholeDiskVerts[j+2] * ls + oz
                  }
                }
              }

              for(var i = 0; i < shape.vertices.length; i += shape.stride){
                var sIdx = i/shape.stride
                var el = blackholes[i/shape.stride]
                if(el.x != 1e5){
                  var subShape = shape.shapeData[sIdx]
                  var ox = subShape.ox
                  var oy = subShape.oy
                  var oz = subShape.oz
                  var ls = (el.mass + 1) / 10
                  for(var j = 0; j < shape.stride; j +=3){
                    var idx = i + j
                    x = shape.vstate[idx+0] = blackholeVerts[j+0] * ls + ox
                    y = shape.vstate[idx+1] = blackholeVerts[j+1] * ls + oy
                    z = shape.vstate[idx+2]= blackholeVerts[j+2] * ls + oz
                  }
                }
              }
              shape.shapeData.map((subShape, sIdx) => {
                subShape.x = blackholes[sIdx].x - subShape.ox
                subShape.y = blackholes[sIdx].y - subShape.oy
                subShape.z = blackholes[sIdx].z - subShape.oz

                subShape.pitch = (-renderer.pitch) * (renderer.cameraMode == 'fps' ? 1 : -1)
                subShape.yaw   = (-renderer.yaw) - shape.yaw
                subShape.roll += .005 * (sIdx %2 ? -1 : 1)
              })
              shape.rotationMode = 2
              
              //shape.yaw = t / 4
              renderer.Draw(shape)
            break
            case 'blackhole disk':
              shape.shapeData.map((subShape, sIdx) => {
                subShape.x = blackholes[sIdx].x - subShape.ox
                subShape.y = blackholes[sIdx].y - subShape.oy
                subShape.z = blackholes[sIdx].z - subShape.oz
                subShape.pitch = (-renderer.pitch) * (renderer.cameraMode == 'fps' ? 1 : -1)
                subShape.yaw   = (-renderer.yaw) - shape.yaw
                subShape.roll += .001 * (sIdx %2 ? -1 : 1)
              })
              shape.rotationMode = 2
            
              //shape.yaw = t / 4
              renderer.Draw(shape)
            break
            case 'lines':
              renderer.Draw(shape)
            break
            case 'cursor bounding':
              if(!window.hovering && !document.pointerLockElement){
                for(var i = 0;
                     i < shape.vertices.length;
                     i += shape.stride){
                  var ls = (t/2%1)*cbSize+1+i/shape.stride*cbSize
                  for(var j = 0; j < shape.stride; j += 3){
                    var idx = i + j
                    shape.vertices[idx+0] = shape.vstate[idx+0] = cbVerts[j + 0] * ls
                    shape.vertices[idx+1] = shape.vstate[idx+1] = cbVerts[j + 1] * ls
                    shape.vertices[idx+2] = shape.vstate[idx+2] = cbVerts[j + 2] * ls
                  }
                }
                shape.x = cursor.x
                shape.y = cursor.y
                shape.z = cursor.z
                renderer.Draw(shape)
              }
            break
            case 'test marker':
              renderer.Draw(shape)
            break
            case 'ship':
              var shipDrag = 1.000001
              if(launched && alive){
                blackholes.forEach((v, i) => {
                  if(v.x != 1e5){
                    var dx1 = v.x - ship.x
                    var dy1 = v.y - ship.y
                    var dz1 = v.z - ship.z
                    d = 2+(Math.hypot(dx1, dy1, dz1)) ** 2.5 / 20
                    ship.vx += dx1 / d * grav
                    ship.vy += dy1 / d * grav
                    ship.vz += dz1 / d * grav
                  }
                })
                
                var p1 = Math.atan2(ship.vx, ship.vz) + Math.PI
                var p2 = -Math.acos(-ship.vy / (Math.hypot(ship.vx, ship.vy, ship.vz)+.00001)) + Math.PI/2
                
                shape.yaw = p1
                shape.pitch = p2
              }         
              
              if(alive){
                shape.x = ship.x += ship.vx
                shape.y = ship.y += ship.vy
                shape.z = ship.z += ship.vz
              }
              ship.vx /= drag
              ship.vy /= drag
              ship.vz /= drag
              if(ship.x > 1e3 || ship.x < -1e3 ||
                 ship.y > 1e3 || ship.y < -1e3 ||
                 ship.z > 1e3 || ship.z < -1e3){
                 alive = false
                 renderer.useKeys = false
                 //shipView = false
              }
              d = Math.hypot(ship.vx, ship.vy, ship.vz)
              if(alive && d > .01 && Rn() < 1)
                console.log(alive)
                x = ship.vx / d * 15
                y = ship.vy / d * 15
                z = ship.vz / d * 15
                for(var n=0; n<5; n++){
                  SpawnSmoke(
                             ship.x - ship.vx/5*n - x,
                             ship.y - ship.vy/5*n - y,
                             ship.z - ship.vz/5*n - z )
                }
                
              if(shipView){
                var shipCamDist = 100
                var shipCamTracking = 12
                var vecx = 0
                var vecy = 0
                var vecz = shipCamDist
                ship.vecPitch += shape.pitch - (ship.vecPitch) / shipCamTracking
                p = Math.atan2(vecy, vecz) + shape.pitch + .5
                d = Math.hypot(vecy, vecz)
                vecy = S(p) * d
                vecz = C(p) * d
                ship.vecYaw += shape.yaw - (ship.vecYaw) / shipCamTracking
                p = Math.atan2(vecx, vecz) + shape.yaw
                d = Math.hypot(vecx, vecz)
                vecx = S(p) * d
                vecz = C(p) * d
                ship.vecx += (vecx - ship.vecx) / shipCamTracking
                ship.vecy += (vecy - ship.vecy) / shipCamTracking
                ship.vecz += (vecz - ship.vecz) / shipCamTracking
                renderer.x = -ship.x - ship.vecx
                renderer.y = -ship.y - ship.vecy + 40
                renderer.z = -ship.z - ship.vecz
                renderer.yaw = -shape.yaw + Math.PI
                renderer.pitch = shape.pitch
              }
              renderer.Draw(shape)
            break
            case 'target':
              if(0){
                shape.shapeData.map((subShape, sIdx) => {
                  if(sIdx < targets.length){
                    subShape.x = targets[sIdx].x - subShape.ox
                    subShape.y = targets[sIdx].y - subShape.oy
                    subShape.z = targets[sIdx].z - subShape.oz
                  }else{
                    subShape.x = 1e5
                    subShape.y = 1e5
                    subShape.z = 1e5
                  }
                })
              }else{
                shape.x = targets[0].x
                shape.y = targets[0].y
                shape.z = targets[0].z
              }
              renderer.Draw(shape)
            break
            case 'cube grid':
              //if(!shipView) renderer.Draw(shape)
              renderer.Draw(shape)
            break
            case 'main':
              renderer.Draw(shape)
            break
            default:
              //renderer.Draw(shape)
            break
          }
        })
        
        if(misplaced.timer > t){
          misplacedShape.x = misplaced.x
          misplacedShape.y = misplaced.y
          misplacedShape.z = misplaced.z
          var diff = (misplaced.timer - t) * 2
          for(var i = 0; i < misplacedVerts.length; i+=3){
            misplacedShape.vertices[i+0] = misplacedVerts[i+0] * (2-diff)
            misplacedShape.vertices[i+1] = misplacedVerts[i+1] * (2-diff)
            misplacedShape.vertices[i+2] = misplacedVerts[i+2] * (2-diff)
          }
          misplacedShape.alpha = diff/2
          renderer.Draw(misplacedShape)
        }
        
        if(shipView && showHUD){
          Coordinates.Overlay.ctx.globalAlpha = alive ? .25 : .5
          Coordinates.Overlay.ctx.clearRect(0,0,w,h)
          Coordinates.Overlay.ctx.drawImage(alive ? HUD : HUD_dead,0,0,w,h)
          Coordinates.Overlay.ctx.globalAlpha = 1
        }
        if(!alive){
          Coordinates.Overlay.ctx.fillStyle = '#400c'
          Coordinates.Overlay.ctx.fillRect(0,0,w,h)
          var fs
          Coordinates.Overlay.ctx.font = (fs=200) + 'px Play'
          Coordinates.Overlay.ctx.strokeStyle = '#f00'
          Coordinates.Overlay.ctx.fillStyle = '#800'
          Coordinates.Overlay.ctx.textAlign = 'center'
          Coordinates.Overlay.ctx.fillText('ded', w/2, h/2)
          Coordinates.Overlay.ctx.lineWidth = 4
          Coordinates.Overlay.ctx.strokeText('ded', w/2, h/2)

          Coordinates.Overlay.ctx.font = (fs=100) + 'px Play'
          Coordinates.Overlay.ctx.strokeStyle = '#f00'
          Coordinates.Overlay.ctx.fillStyle = '#800'
          Coordinates.Overlay.ctx.textAlign = 'center'
          Coordinates.Overlay.ctx.fillText('hit spacebar to try again', w/2, h/2 + fs)
          Coordinates.Overlay.ctx.lineWidth = 1
          Coordinates.Overlay.ctx.strokeText('hit spacebar to try again', w/2, h/2 + fs)
        }
        if(unDid) {
          bhIdx--
          unDid = false
        }
      }
      
    </script>
  </body>
</html>
