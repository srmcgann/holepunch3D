<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Play;
      }
      .modal{
        position: fixed;
        background: #111e;
        z-index: 200;
        height: 100vh;
        width: 100%;
        overflow: hidden;
        display: none;
      }
      canvas{
        cursor: crosshair;
      }
      hr{
       line-height: 0;
       height: 0;
       margin: 0;
       border-color: #666;
      }
      #hotkeys, #currentObjective{
        overflow:  hidden;
        font-family: monospace;
        width: 500px;
        white-space: pre;
        color: #ff4;
        border-radius: 50px;
        padding: 10px;
        min-height: 500px;
        top: 50%;
        left: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        display: none;
        overflow-y: auto;
        background: #2221;
        box-shadow: 0 0 250px #fff3;
        border-left: 5px solid #4448;
        border-top: 5px solid #4448;
        border-right: 5px solid #0008;
        border-bottom: 5px solid #0008;
      }
      #header, #footer{
        line-height: 32px;
        font-size: 32px;
        padding: 0px;
        position: fixed;
        width: 100vw;
        z-index: 100;
      }
      #header{
        height: 34px;
        background: linear-gradient(-90deg, #444, #444, #333, #333, #111, #111, #111, #111,#200,#400,#400);
        border-top: 1px solid #333;
        border-bottom: 1px solid #500;
      }
      #footerControlCluster{
        text-align: center;
      }
      .sidebars{
        position: fixed;
        width: 10px;
        height: 100vh;
        z-index: 200;
      }
      #leftSidebar{
        background: linear-gradient(180deg, #400, #400, #444, #444);
        border-top: 1px solid #333;
        left: 0;
        top: 0;
      }
      #rightSidebar{
        background: linear-gradient(180deg, #444, #444, #111, #111);
        border-top: 1px solid #333;
        right: 0;
        top: 0;
      }
      #footer{
        height: 68px;
        background: linear-gradient(90deg, #444, #444, #333, #333, #111, #111, #111, #111);
        top: calc(100vh - 68px);
        border-top: 1px solid #fff4;
      }
      #headerTitle{
        color: #ba8;
        transform: scale(1.5, 1.0);
        display: inline-block;
        margin-left: 80px;
        font-style: italic;
        font-weight: 900;
        text-shadow: 0px 0px 5px #f00;
      }
      .buttons:focus{
        outline: none;
      }
      .buttons{
        border-radius: 10px;
        border: none;
        font-size: 20px;
        cursor: pointer;
      }
      button{
        font-family: Play;
      }
      .specialArrow{
        display: block;
        position: absolute;
        left: 370px;
        margin-top: -34px;
        font-size: 44px;
        transform: rotate(-15deg);
      }
      .closeButton{
        left: 50%;
        line-height: 0;
        padding-top: 5px;
        min-height: 32px;
        transform: translate(-50%);
        background: #319;
        color: #dbf;
        text-shadow: 2px 2px 2px #000;
        width: 140px;
        position: absolute;
        border-top: 1px solid #84f;
        border-left: 1px solid #84f;
        border-right: 3px solid #208;
        border-bottom: 3px solid #208;
      }
      .muteButton_muted, .muteButton_unmuted{
        border-top: 3px solid #dbd79e;
        border-left: 3px solid #dbd79e;
        border-right:3px solid #403e2c;
        border-bottom: 3px solid #403e2c;
        width: 40px;
        height: 32px;
        background-color: #6e6c4d;
        background-size: 25px 25px;
        background-position: center center;
        background-repeat: no-repeat;
      }
      .muteButton_muted{
        background-image: url(https://srmcgann.github.io/holepunch3D/mute.png);
      }
      .muteButton_unmuted{
        background-image: url(https://srmcgann.github.io/holepunch3D/audio.png);
      }
      #objectiveText{
        text-align: center;
      }
      .logo{
        width: 400px;
        margin-top: -50px;
      }
      .objImg{
        width: 100px;
        margin-top: 5px;
        margin-left: 25px;
      }
      #helpButton{
        background: #597;
        border-top: 3px solid #6f8;
        border-left: 3px solid #6f8;
        border-right:3px solid #264;
        border-bottom: 3px solid #264;
      }
      #helpButton, #muteButton{
        min-width: unset;
        margin-left: 5px;
        margin-right: 5px;
        color: #0f8;
        font-weight:900;
      }
      .massMeterContainer{
        width: 306px;
        padding-left: 0!important;
      }
      #massMeter{
        color: #fa4;
      }
      .menuLabel{
        font-size: .4em;
        margin-left: 30px;
        vertical-align: top;
        color: #feb
      }
      .headerElement{
        min-width: 300px;
      }
      .footerElement{
        //width: 200px;
      }
      .headerElement, .footerElement{
        margin-left: 3px;
        color: #feb;
        background: #000;
        font-size: 14px;
        padding-top: 7px;
        padding-left: 10px;
        padding-right: 10px;
        height: 20px;
        margin-top: 3px;
        line-height: 1em;
        display: inline-block;
        vertical-align: top;
        border-radius: 5px;
        border-bottom: 1px solid #888;
        border-right: 1px solid #888;
        text-align: left;
      }
      #massNumeric, #holeCount{
        color: #fa4;
        font-weight: 900;
        padding-left: 0!important;
      }
      .infoContent{
        display: inline-block;
        color: #8fb;
        font-size: 1.25em;
      }
      #launchButton{
        background: #f80;
        color: #fff;
        border-top: 2px solid #db8;
        border-left: 2px solid #db8;
        border-right: 3px solid #543;
        border-bottom: 3px solid #543;
        text-shadow: 2px 2px 2px #120;
      }
      #undoButton, #redoButton{
        font-size: 15px;
        line-height: .6em;
        padding-top: 4px;
        padding-bottom: 0;
        margin-top: 2px;
      }
      .headerButton:focus, .footerButton:focus{
        outline: none;
      }
      .headerButton, .footerButton{
        vertical-align: top;
        font-family: Play;
        font-size: 20px;
        margin-top: 5px;
        margin-left: 10px;
        border-radius: 10px;
        min-width: 80px;
        line-height: .85em;
        padding-bottom: 3px;
        cursor: pointer;
        background-color: #864;
        color: #fff;
        border-top: 2px solid #db8;gl
        border-left: 2px solid #db8;
        border-right: 3px solid #543;
        border-bottom: 3px solid #543;
        text-shadow: 2px 2px 2px #120;
      }
      #loadingText{
        position: fixed;
        top: 50%;
        left: 0;
        width: 100%;
        transform: translateY(-50%);
        font-size: 66px;
        font-family: Play;
        color: #40f8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loadingText">LOADING</div>
    <div
      class="modal"
      id="dialogueScreen"
      tabindex="0"
      onkeydown="window.keysOnButton(event)"
    ></div>
    <div id="header">
      <div id="headerTitle">HOLEPUNCH 3D</div>
      <div
        class="headerElement"
        style="float:right;margin-right: 10px;"
      >
        LEVEL
        <div
          id="levelName"
          class="infoContent"
        ></div>
      </div>
      <button
        class="headerButton"
        style="float: right; margin-top: 3px;"
        id="helpButton"
        onclick="window.ShowObjective()"
        onmouseover="window.hovering = true"
        onmouseout="window.hovering = false"
        title="show objective"
      >
        ?
      </button>
    </div>
    <div class="sidebars" id="leftSidebar"></div>
    <div class="sidebars" id="rightSidebar"></div>
    <div id="hotkeys"
      onkeydown="window.keysOnButton(event)"
      tabindex="0"
    >
      <button
        class="buttons closeButton"
        title="close this"
        tabindex="0"
        style="top:450px"
        autofocus="true"
        onclick="window.CloseModal()"
      >close <span style="font-size:.5em;vertical-align: middle;">[ESC]</span></button>


                ARROWS  : rotate view
                O       : ship-cam view
                H       : toggle HUD (in ship-camera mode)
                C       : reset camera to default
                ESC     : close this window
    </div>
    <div
      id="currentObjective"
      onkeydown="window.keysOnButton(event)"
      tabindex="0"
    >
      <div id="objectiveText"></div>
      <button
        class="buttons closeButton"
        title="close this"
        tabindex="0"
        style="top:450px"
        autofocus="true"
        onclick="window.CloseModal()"
      >close <span style="font-size:.5em;vertical-align: middle;">[ESC]</span></button>
    </div>
    <div id="footer">
      <div id="footerControlCluster">
        <span class="menuLabel">
          MASS
        </span>
        <div class="footerElement massMeterContainer" >
          <div
            id="massMeter"
            class="infoContent"
          ></div>
        </div>
        <div class="footerElement" style="min-width: unset">
          <div
            class="infoContent"
            id="massNumeric"
          ></div>
        </div>
        <hr>
        <button
          class="footerButton"
          id="launchButton"
          onclick="window.Launch()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="Launch"
        >
          LAUNCH
        </button>
        <button
          class="footerButton"
          onclick="window.Reset()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="remove all black holes"
        >
          RESET
        </button>
        <button
          class="footerButton"
          id="undoButton"
          onclick="window.Undo()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="undo last modification"
        >
          UNDO<br><span style="font-size:.66em">ctrl + z</span>
        </button>
        <button
          class="footerButton"
          id="redoButton"
          onclick="window.Redo()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="redo last modification"
        >
          REDO<br><span style="font-size: .66em">ctrl + shift + z</span>
        </button>
        <span class="menuLabel">
          HOLES
        </span>
        <div class="footerElement holeCountContainer" style="min-width: unset" >
          <div
            id="holeCount"
            class="infoContent"
          ></div>
        </div>
        <button
          class="headerButton muteButton_unmuted"
          style="margin-left: 15px;margin-top: 2px;"
          id="muteButton"
          onclick="window.ToggleMute()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="mute / unmute"
        ></button>
      </div>
    </div>
    <script>
      var el = document.querySelector('#loadingText')
      var loaded = false, ct=0
      window.cancelLoadingText = false
      var lDraw = () => {
        var l = ('.').repeat(3+((ct/3|0)%5))
        el.innerHTML = `${l} LOADING ${l}`
        ct++
        if(!window.cancelLoadingText) requestAnimationFrame(lDraw)
      }
      lDraw()
    </script>
    <script type="module">

      import * as Coordinates from
      "https://cantelope42.github.io/tempppppp/coordinates.js?3"
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js?2"

      var rendererOptions = {
        ambientLight: .5, margin: 10, fit: 'cover',
        fov: 900, width: 1920, height: 1080,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)

      
      rendererOptions.context = {
        mode: '2d'
      }
      rendererOptions.attachToBody = true
      var scratchCanvas = await Coordinates.Renderer(rendererOptions)
      var c = scratchCanvas.c
      var ctx = scratchCanvas.ctx
      var w = c.width = renderer.c.width
      var h = c.height = renderer.c.height
      
      //var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/brutalism1.jpg'
      //var refTexture = 'https://i.imgur.com/PUZkjwn.mp4'
      
      //var refTexture = 'https://srmcgann.github.io/skyboxes7/HDRI/quickgrid.png'
      var refTexture = 'https://srmcgann.github.io/skyboxes/HDRI/6.jpg'
      var targetImgURL = 'https://srmcgann.github.io/holepunch3D/target.png'
      var hp3dLogo = 'https://srmcgann.github.io/holepunch3D/hp3dLogo.png'
      var arrowKeys = 'https://srmcgann.github.io/holepunch3D/arrowKeys.png'
      var obstacleImg = 'https://srmcgann.github.io/holepunch3D/obstacle.png'
      
      var showBackground = true
      var playbackSpeed = 2
      
      var goal = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/goal.ogg'
      await fetch(url).then(res=>res.blob()).then(data => {
        goal.loop = false
        goal.volume = 1
        goal.src = URL.createObjectURL(data)
      })

      var increase = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/increase.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        increase.loop = false
        increase.volume = .8
        increase.src = URL.createObjectURL(data)
      })

      var missile = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/missile.wav'
      await fetch(url).then(res=>res.blob()).then(data => {
        missile.loop = false
        missile.volume = .5
        missile.src = URL.createObjectURL(data)
      })

      var alarm = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/alarm.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        alarm.loop = false
        alarm.volume = .25
        alarm.src = URL.createObjectURL(data)
      })

      var engines = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/engines.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        engines.loop = true
        engines.volume = .75
        engines.src = URL.createObjectURL(data)
      })

      var splode = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/splode.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        splode.loop = false
        splode.volume = 1
        splode.src = URL.createObjectURL(data)
      })

      var splode2 = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/splode2.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        splode2.loop = false
        splode2.volume = .25
        splode2.src = URL.createObjectURL(data)
      })

      var decrease = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/decrease.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        decrease.loop = false
        decrease.volume = .8
        decrease.src = URL.createObjectURL(data)
      })

      var destroy = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/destroy.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        destroy.loop = false
        destroy.volume = 1
        destroy.src = URL.createObjectURL(data)
      })

      var misclick = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/misclick.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        misclick.loop = false
        misclick.volume = .8
        misclick.src = URL.createObjectURL(data)
      })

      var strum = new Audio()
      var url = 'https://srmcgann.github.io/holepunch3D/strum.mp3'
      await fetch(url).then(res=>res.blob()).then(data => {
        strum.loop = false
        strum.volume = .8
        strum.src = URL.createObjectURL(data)
      })

      /*var mutedIcon = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/mute.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        mutedIcon.src = URL.createObjectURL(data)
      })
      
      var audioIcon = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/audio.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        audioIcon.src = URL.createObjectURL(data)
      })
      */
      
      var HUD = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/HUD.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        HUD.src = URL.createObjectURL(data)
      })
      
      var logo = new Image()
      var url = hp3dLogo
      await fetch(url).then(res=>res.blob()).then(data => {
        logo.src = URL.createObjectURL(data)
      })
      
      var HUD_dead = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/HUD_red.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        HUD_dead.src = URL.createObjectURL(data)
      })
      
      var victoryScreen = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/victory.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        victoryScreen.src = URL.createObjectURL(data)
      })
      
      var deathScreen = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/deathScreen.jpg'
      await fetch(url).then(res=>res.blob()).then(data => {
        deathScreen.src = URL.createObjectURL(data)
      })
      
      var decButton = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/decButton.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        decButton.src = URL.createObjectURL(data)
      })
      
      var incButton = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/incButton.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        incButton.src = URL.createObjectURL(data)
      })
      
      var delButton = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/delete.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        delButton.src = URL.createObjectURL(data)
      })
      
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var x, y, z, p, q, d, l
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var boundingBoxSize = 1e3/4

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .1}},
        { uniform: {
          type: 'phong',
          value: .8
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          playbackSpeed,
          value: .1
        } },
        { uniform: {
          type: 'refraction',
          angleOfRefraction: -.5,
          map: showBackground ? refTexture : '',
          enabled: true,
          playbackSpeed,
          value: .25
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .1}},
        { uniform: {
          type: 'phong',
          value: .1
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          playbackSpeed,
          value: .05
        } },
        { uniform: {
          type: 'refraction',
          angleOfRefraction: -.5,
          map: showBackground ? refTexture : '',
          enabled: true,
          playbackSpeed,
          value: .5
        } },
      ]
      var obstaclesShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .1}},
        { uniform: {
          type: 'phong',
          value: .05
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          playbackSpeed,
          enabled: true,
          value: .025
        } },
        { uniform: {
          type: 'refraction2',
          angleOfRefraction: -1,
          map: showBackground ? refTexture : '',
          enabled: true,
          playbackSpeed,
          value: .75
        } },
      ]
      var mazeShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var colors = []
      var len = 2564*3 * 3
      Array(len).fill().map((v, i) => {
        var rgb   = Coordinates.HSVToRGB(360/len*i, 1, 1)
        var red   = rgb[0] / 256
        var green = rgb[1] / 256
        var blue  = rgb[2] / 256
        colors.push(red, green, blue, 1)
      })
      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .1}},
        { uniform: {
          type: 'phong',
          value: .05
        } },
        { attribute: {
          type: 'custom',
          enabled: true, 
          value: colors,
          name: 'customColors',
          stride: 4,
          dataType: renderer.ctx.FLOAT,
          vertDeclaration: `
            attribute vec4 customColors;
            varying vec4 attribCols;
          `,
          vertCode:        `
            attribCols = customColors;
          `,
          fragDeclaration: `
            varying vec4 attribCols;
          `,
          fragCode: `
            addInColor = attribCols;
          `,
        }},
      ]
      var cursorBoundingShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .5}},
        { uniform: {
          type: 'phong',
          value: .4
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          playbackSpeed,
          value: .3
        } },
      ]
      var shipShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: 1.5}},
        { uniform: {
          type: 'phong',
          value: 0

              d = (d_=Math.hypot(dx1, dy1, dz1)) ** 3
              vx += dx1 / d * grav * v.mass
              vy += dy1 / d * grav * v.mass
              vz += dz1 / d * grav * v.mass
              if(d_ < v.mass/8) collision = true
            }

                  shape.vertices[i+2] = smoke[idx].z += smoke[idx].vz

            break
            case 'planet':
              if(planets.length){
                shape.shapeData.map((subShape, sIdx) => {

                    p = Math.atan2(pl.y, pl.z) + .01
                    d = Math.hypot(pl.y, pl.z)
                    pl.x = sIdx ? S(Math.PI*8/(planets.length-1)*sIdx)*20*C(t) : 0
                    pl.y = S(p) * d
                    pl.z = C(p) * d
                    
                    subShape.x = pl.x - subShape.ox
                    subShape.y = pl.y - subShape.oy
                    subShape.z = pl.z - subShape.oz
                    for(var i = 0; i < shape.stride; i += 3){
                      var idx = i + sIdx * shape.stride
                      x = basePlanetVerts[i+0] * pl.size + subShape.ox
                      y = basePlanetVerts[i+1] * pl.size + subShape.oy
                      z = basePlanetVerts[i+2] * pl.size + subShape.oz
                      shape.vstate[idx+0] = x
                      shape.vstate[idx+1] = y

                    subShape.y = 0
                    subShape.z = 0
                  }

              }

                  var oy = shape.shapeData[j].oy
                  var oz = shape.shapeData[j].oz
                  if(0) for(var i = 0; i < baseMazeVerts.length; i+=3){

                    z = baseMazeVerts[i+2]

                    p = Math.atan2(x, y) + tht

                    y = baseMazeNormalVecs[i+1]
                    z = baseMazeNormalVecs[i+2]
                    p = Math.atan2(y,z) //+ t
                    d = Math.hypot(y,z)
                    y = S(p) * d
                    z = C(p) * d
                    p = Math.atan2(x, y) + tht
                    d = Math.hypot(x, y)
                    x = S(p) * d
                    y = C(p) * d
                    shape.normalVecs[i+j*shape.stride+0]=x
                    shape.normalVecs[i+j*shape.stride+1]=y
                    shape.normalVecs[i+j*shape.stride+2]=z
                  }
                  for(var i = 0; i < baseMazeVerts.length; i+=9){
                    var idx = i + j * shape.stride
                    var x1 = shape.vertices[idx+0]
                    var y1 = shape.vertices[idx+1]
                    var z1 = shape.vertices[idx+2]
                    p = Math.atan2(y1,z1) + shape.pitch
                    d = Math.hypot(y1,z1)
                    y1 = S(p) * d
                    z1 = C(p) * d
                    p = Math.atan2(x1, z1) + shape.yaw
                    d = Math.hypot(x1, z1)
                    x1 = S(p) * d
                    z1 = C(p) * d

                    var x2 = shape.vertices[idx+3]
                    var y2 = shape.vertices[idx+4]
                    var z2 = shape.vertices[idx+5]
                    p = Math.atan2(y2,z2) + shape.pitch
                    d = Math.hypot(y2,z2)
                    y2 = S(p) * d
                    z2 = C(p) * d
                    p = Math.atan2(x2, z2) + shape.yaw
                    d = Math.hypot(x2, z2)
                    x2 = S(p) * d
                    z2 = C(p) * d

                    var x3 = shape.vertices[idx+6]
                    var y3 = shape.vertices[idx+7]
                    var z3 = shape.vertices[idx+8]
                    p = Math.atan2(y3,z3) + shape.pitch
                    d = Math.hypot(y3,z3)
                    y3 = S(p) * d
                    z3 = C(p) * d
                    p = Math.atan2(x3, z3) + shape.yaw
                    d = Math.hypot(x3, z3)
                    x3 = S(p) * d
                    z3 = C(p) * d

                           //shipView = false
                        }
                        d = Math.hypot(ship.vx, ship.vy, ship.vz)
                        if(alive && d > .01 && !levelComplete){
                          x = ship.vx / d * 3
                          y = ship.vy / d * 3
                          z = ship.vz / d * 3
                          var p1 = Math.atan2(x, z)
                          var p2 = -Math.acos(y / (Math.hypot(x,y,z)+.00001))-Math.PI/2
                          for(var n=0; n<4; n++){
                            var x1 = S(p=Math.PI*2/2*n+Math.PI/2+shape.roll) * 8
                            var y1 = C(p) * 8
                            var z1 = -6
                            p = Math.atan2(y1,z1) + p2
                            d = Math.hypot(y1,z1)
                            y1 = S(p) * d
                            z1 = C(p) * d
                            p = Math.atan2(x1,z1) + p1
                            d = Math.hypot(x1,z1)
                            x1 = S(p) * d
                            z1 = C(p) * d
                            SpawnSmoke(
                               x1 + ship.x - ship.vx/4*n - x,
                               y1 + ship.y - ship.vy/4*n - y,
                               z1 + ship.z - ship.vz/4*n - z )
                          }
                        }
                        if(shipView){
                          var shipCamDist = 100
                          var shipCamTracking = 12
                          var vecx = 0
                          var vecy = 0
                          var vecz = shipCamDist
                          ship.vecPitch += shape.pitch - (ship.vecPitch) / shipCamTracking
                          p = Math.atan2(vecy, vecz) + shape.pitch + .5
                          d = Math.hypot(vecy, vecz)
                          vecy = S(p) * d
                          vecz = C(p) * d
                          ship.vecYaw += shape.yaw - (ship.vecYaw) / shipCamTracking
                          p = Math.atan2(vecx, vecz) + shape.yaw
                          d = Math.hypot(vecx, vecz)
                          vecx = S(p) * d
                          vecz = C(p) * d
                          ship.vecx += (vecx - ship.vecx) / shipCamTracking
                          ship.vecy += (vecy - ship.vecy) / shipCamTracking
                          ship.vecz += (vecz - ship.vecz) / shipCamTracking
                          targX = -ship.x - ship.vecx
                          targY = -ship.y - ship.vecy + 40
                          targZ = -ship.z - ship.vecz
                          targYaw = -shape.yaw + Math.PI
                          targPitch = shape.pitch
                        }
                      }
                    }
                  }
                }
                if(!levelComplete) shape.roll += .02 * (launched ? 16 : 0)
                renderer.Draw(shape)
              }
            break
            case 'target':
              if(0){
                shape.shapeData.map((subShape, sIdx) => {
                  if(sIdx < targets.length){
                    subShape.x = targets[sIdx].x - subShape.ox
                    subShape.y = targets[sIdx].y - subShape.oy
                    subShape.z = targets[sIdx].z - subShape.oz
                  }else{
                    subShape.x = 1e5
                    subShape.y = 1e5
                    subShape.z = 1e5
                  }
                })
              }else{
                shape.x = targets[0].x
                shape.y = targets[0].y
                shape.z = targets[0].z
              }
              renderer.Draw(shape)
            break
            case 'cube grid':
              //if(!shipView) renderer.Draw(shape)
              renderer.Draw(shape)
            break
            case 'cursor':
              //if(!launched && alive) renderer.Draw(shape)
            break
            case 'main':
              renderer.Draw(shape)
            break
            default:
              //renderer.Draw(shape)
            break
          }
        })
        
        if(alive && !launched){
          var buttonHover = !!blackholes.filter(v=>v.buttonHover).length
          if(!buttonHover){
            document.querySelectorAll('canvas').forEach(el => {
              el.style.cursor = 'crosshair'
            })
          }
          var hoverTrigger = false
          blackholes.map((v, i) => {
            if(v.x != 1e5){
              x = v.x
              y = v.y
              z = v.z
              var ar = Coordinates.GetShaderCoord(x,y,z,{
                x:0, y: 0, z: 0, roll: 0, pitch: 0, yaw: 0,
              }, renderer)
              if(ar){
                var bx = ar[0]
                var by = ar[1]
                var bz = ar[2]
                var s = 100 * v.mass
                var n = 1+v.mass/100
                if(!hoverTrigger &&
                  (d=Math.hypot(x=bx-mx, y=by-my)) < s/bz ||
                    (v.hover && -y < 80*n && -y > -90*n &&
                    x > -140 && x < 140)){
                  hoverTrigger = v.hover = true
                  if(renderer.cameraMode == 'fps') renderer.useKeys = false
                  if(!buttonHover)
                    document.querySelectorAll('canvas').forEach(el => {
                      el.style.cursor = 'move'
                    })
                }else{
                  if(!v.dragging) {
                    v.hover = false
                    if(renderer.cameraMode == 'fps') renderer.useKeys = true
                  }
                }
              }
            }
          })
          if(blackholes.filter(v=>v.hover).length > 1){
            var first = false
            blackholes.map(v=>{
              if(v.hover){
                if(first) v.hover = false
                first = true
              }
            })
          }
        }
        
        if(misplaced.timer > t){
          misplacedShape.x = misplaced.x
          misplacedShape.y = misplaced.y
          misplacedShape.z = misplaced.z
          var diff = (misplaced.timer - t) * 2
          for(var i = 0; i < misplacedVerts.length; i+=3){
            misplacedShape.vertices[i+0] = misplacedVerts[i+0] * (2-diff)
            misplacedShape.vertices[i+1] = misplacedVerts[i+1] * (2-diff)
            misplacedShape.vertices[i+2] = misplacedVerts[i+2] * (2-diff)
          }
          misplacedShape.alpha = diff/2
          renderer.Draw(misplacedShape)
        }
       
        //renderer.Draw(tempCube)
      }
      
      window.cancelLoadingText = true
      
    </script>
  </body>
</html>
