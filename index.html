<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Play;
      }
      .modal{
        position: fixed;
        background: #011d;
        z-index: 200;
        height: 100vh;
        width: 100%;
        overflow: hidden;
        display: none;
      }
      hr{
       line-height: 0;
       height: 0;
       margin: 0;
       border-color: #666;
      }
      #hotkeys{
        width: 500px;
        color: #ff4;
        background: #1484;
        border-radius: 5px;
        border: 1px solid #148a;
        padding: 10px;
        min-height: 500px;
        top: 50%;
        left: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        display: none;
        overflow-y: auto;
      }
      #header, #footer{
        line-height: 32px;
        font-size: 32px;
        padding: 0px;
        position: fixed;
        width: 100vw;
        z-index: 100;
      }
      #header{
        height: 34px;
        background: linear-gradient(-90deg, #444, #444, #333, #333, #111, #111, #111, #111);
        border-bottom: 1px solid #fff4;
      }
      #footerControlCluster{
        text-align: center;
      }
      #footer{
        height: 68px;
        background: linear-gradient(90deg, #444, #444, #333, #333, #111, #111, #111, #111);
        top: calc(100vh - 68px);
        border-top: 1px solid #fff4;
      }
      #headerTitle{
        color: #ba8;
        transform: scale(1.75, 1.0);
        display: inline-block;
        margin-left: 100px;
        font-style: italic;
        font-weight: 900;
        text-shadow: 0px 0px 5px #f00;
      }
      .buttons:focus{
        outline: none;
      }
      .buttons{
        border-radius: 10px;
        border: none;
        font-size: 20px;
        cursor: pointer;
      }
      .closeButton{
        background: #844;
        color: #faa;
        text-shadow: 2px 2px 2px #000;
        width: 140px;
        position: absolute;
        border-top: 1px solid #f88;
        border-left: 1px solid #f88;
        border-right: 3px solid #600;
        border-bottom: 3px solid #600;
      }
      #helpButton{
        min-width: unset;
        margin-left: 30px;
        background: #597;
        color: #0f8;
        font-weight:900;
        border-top: 3px #6f8 solid;
        border-left: 3px solid #6f8;
        border-right:3px solid #264;
        border-bottom: 3px solid #264;
      }
      .massMeterContainer{
        width: 318px;
        padding-left: 0!important;
      }
      #massMeter{
        color: #fa4;
      }
      .menuLabel{
        font-size: .4em;
        margin-left: 30px;
        vertical-align: top;
        color: #feb
      }
      .footerElement{
        margin-left: 3px;
        color: #feb;
        background: #000;
        font-size: 14px;
        padding-top: 7px;
        padding-left: 10px;
        padding-right: 10px;
        height: 20px;
        margin-top: 3px;
        line-height: 1em;
        display: inline-block;
        vertical-align: top;
        min-width: 240px;
        border-radius: 5px;
        border-bottom: 1px solid #888;
        border-right: 1px solid #888;
        text-align: left;
      }
      #massNumeric, #holeCount{
        color: #fa4;
        font-weight: 900;
        padding-left: 0!important;
      }
      .infoContent{
        display: inline-block;
        color: #8fb;
        font-size: 1.25em;
      }
      #launchButton{
        background: #f80;
        color: #fff;
        border-top: 2px solid #db8;
        border-left: 2px solid #db8;
        border-right: 3px solid #543;
        border-bottom: 3px solid #543;
        text-shadow: 2px 2px 2px #120;
      }
      .footerButton{
        vertical-align: top;
        font-family: Play;
        font-size: 20px;
        margin-top: 5px;
        margin-left: 10px;
        border-radius: 10px;
        min-width: 80px;
        line-height: .85em;
        padding-bottom: 3px;
        cursor: pointer;
        background: #864;
        color: #fff;
        border-top: 2px solid #db8;
        border-left: 2px solid #db8;
        border-right: 3px solid #543;
        border-bottom: 3px solid #543;
        text-shadow: 2px 2px 2px #120;
      }
    </style>
  </head>
  <body>
    <div
      class="modal"
      id="dialogueScreen"
    ></div>
    <div id="header">
      <div id="headerTitle">HOLEPUNCH 3D</div>
    </div>
    <div id="hotkeys">
      <button
        class="buttons closeButton"
        title="close window"
        tabindex="0"
        onclick="window.CloseModal()"
        style="left: 300px;top:450px"
        onkeydown="window.keysOnButton(event)"
        autofocus="true"
      >close [ESC]</button>
      ESC        : close this window<br>
      O            : toggle ship-camera mode<br>
      H            : toggle HUD (in ship-camera mode)<br>
      blah<br>
      blah<br>
    </div>
    <div id="footer">
      <div id="footerControlCluster">
        <div class="footerElement" >
          LEVEL
          <div
            id="levelName"
            class="infoContent"
          ></div>
        </div>
        <button
          class="footerButton"
          id="launchButton"
          onclick="window.Launch()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="Launch"
        >
          LAUNCH
        </button>
        <button
          class="footerButton"
          onclick="window.Reset()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="remove all black holes"
        >
          RESET
        </button>
        <button
          class="footerButton"
          onclick="window.Undo()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="undo last placement"
        >
          UNDO
        </button>
        <hr>
        <span class="menuLabel">
          MASS
        </span>
        <div class="footerElement massMeterContainer" >
          <div
            id="massMeter"
            class="infoContent"
          ></div>
        </div>
        <div class="footerElement" style="min-width: unset">
          <div
            class="infoContent"
            id="massNumeric"
          ></div>
        </div>
        <span class="menuLabel">
          HOLES
        </span>
        <div class="footerElement holeCountContainer" style="min-width: unset" >
          <div
            id="holeCount"
            class="infoContent"
          ></div>
        </div>
        <button
          class="footerButton"
          id="helpButton"
          onclick="window.ShowHotkeys()"
          onmouseover="window.hovering = true"
          onmouseout="window.hovering = false"
          title="show hot keys & instructions"
        >
          ?
        </button>
      </div>
    </div>
    <script type="module">

      import * as Coordinates from
      "https://cantelope42.github.io/tempppppp/coordinates.js?3"
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"

      var rendererOptions = {
        ambientLight: .5, margin: 10, fit: 'cover',
        fov: 900, width: 1920, height: 1080,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)

      rendererOptions.context = {
        mode: '2d'
      }
      rendererOptions.attachToBody = true
      var scratchCanvas = await Coordinates.Renderer(rendererOptions)
      var c = scratchCanvas.c
      var ctx = scratchCanvas.ctx
      var w = c.width = renderer.c.width
      var h = c.height = renderer.c.height
      
      var refTexture = 'https://srmcgann.github.io/skyboxes2/HDRI/stars.jpg'
      //var refTexture = 'https://i.imgur.com/Ad8pyZy.mp4'
      //var refTexture = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/pathway_morning.jpg'
      
      var showBackground = true

      
      var HUD = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/HUD_teal.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        HUD.src = URL.createObjectURL(data)
      })
      
      var HUD_dead = new Image()
      var url = 'https://srmcgann.github.io/holepunch3D/HUD_red.png'
      await fetch(url).then(res=>res.blob()).then(data => {
        HUD_dead.src = URL.createObjectURL(data)
      })
      
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var x, y, z, p, q, d
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .33}},
        { uniform: {
          type: 'phong',
          value: .6
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          value: .1
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var colors = []
      var len = 2564*3 * 3
      Array(len).fill().map((v, i) => {
        var rgb   = Coordinates.HSVToRGB(360/len*i, 1, 1)
        var red   = rgb[0] / 256
        var green = rgb[1] / 256
        var blue  = rgb[2] / 256
        colors.push(red, green, blue, 1)
      })
      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .1}},
        { uniform: {
          type: 'phong',
          value: .05
        } },
        { attribute: {
          type: 'custom',
          enabled: true, 
          value: colors,
          name: 'customColors',
          stride: 4,
          dataType: renderer.ctx.FLOAT,
          vertDeclaration: `
            attribute vec4 customColors;
            varying vec4 attribCols;
          `,
          vertCode:        `
            attribCols = customColors;
          `,
          fragDeclaration: `
            varying vec4 attribCols;
          `,
          fragCode: `
            addInColor = attribCols;
          `,
        }},
      ]
      var cursorBoundingShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .5}},
        { uniform: {
          type: 'phong',
          value: .4
        } },
        { uniform: {
          type: 'reflection',
          map: showBackground ? refTexture : '',
          value: .3
        } },
      ]
      var shipShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: 1.5}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var blackholeShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .85}},
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .2}},
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var cubeGridShader = await Coordinates.BasicShader(renderer, shaderOptions)
      
      
      var axisLength = 50
      var iLc = axisLength*3 + 1e3
      var colors = []
      Array(iLc).fill().map((v, i) => {
        var rgb   = Coordinates.HSVToRGB(360/iLc*i, 1, 1)
        var red   = rgb[0] / 256
        var green = rgb[1] / 256
        var blue  = rgb[2] / 256
        colors.push(red, green, blue, 1)
      })
      
      var shaderOptions = [
        { attribute: {
          type: 'custom',
          enabled: true, 
          value: colors,
          name: 'customColors',
          stride: 4,
          dataType: renderer.ctx.FLOAT,
          vertDeclaration: `
            attribute vec4 customColors;
            varying vec4 attribCols;
          `,
          vertCode:        `
            attribCols = customColors;
          `,
          fragDeclaration: `
            varying vec4 attribCols;
          `,
          fragCode: `
            mixColor = attribCols;
          `,
        }},
      ]
      var linesShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var iSmokec = 5e3
      var iSmokev = .04
      var particleColors = []
      Array(iSmokec).fill().map((v, i) => {
        var rgb   = Coordinates.HSVToRGB(360/iSmokec*i, 1, 1)
        var red   = rgb[0] / 256
        var green = rgb[1] / 256
        var blue  = rgb[2] / 256
        colors.push(red, green, blue, 1)
      })
      
      var shaderOptions = [
        { attribute: {
          type: 'custom',
          enabled: true, 
          value: particleColors,
          name: 'customColors',
          stride: 4,
          dataType: renderer.ctx.FLOAT,
          vertDeclaration: `
            attribute vec4 customColors;
            varying vec4 attribCols;
          `,
          vertCode:        `
            attribCols = customColors;
          `,
          fragDeclaration: `
            varying vec4 attribCols;
          `,
          fragCode: `
            mixColor = attribCols;
          `,
        }},
      ]
      var particleShader = await Coordinates.BasicShader(renderer, shaderOptions)
      
      window.keysOnButton = e => {
        if(e.keyCode == 27){
          CloseModal()
        }
      }

      var shapes = []

      if(showBackground){
        var geoOptions = {
          shapeType: 'dodecahedron',
          name: 'background',
          sphereize: 1,
          subs: 4,
          map: showBackground ? refTexture : '',
          size: 5e3,
          colorMix: 0,
        }
        await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
          shapes.push(geometry)
          await backgroundShader.ConnectGeometry(geometry)
        })
      }
      
      var geoOptions = {
        shapeType: 'obj',
        url: 'https://srmcgann.github.io/holepunch3D/cubeGrid.obj',
        map: 'https://srmcgann.github.io/holepunch3D/cubegrid.png',
        name: 'cube grid',
        disableDepthTest: true,
        alpha: .9,
        scaleX: 1e3,
        scaleY: 1e3,
        scaleZ: 1e3,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await cubeGridShader.ConnectGeometry(geometry)
      })  
      
      var pointArray = Array(10).fill().map((v,i)=>[0,0,0])
      var cbVerts
      var cbSize = 1
      var geoOptions = {
        shapeType: 'obj',
        url: 'https://srmcgann.github.io/holepunch3D/axis_marker_with_spatial_references.obj?2',
        //map: 'https://srmcgann.github.io/holepunch3D/axisMarker.png',
        name: 'axis marker',
        colorMix: 0,
        scaleX: 1e3,
        scaleY: 1e3,
        scaleZ: 1e3,
        //subs: 2,
        //sphereize: 1,
        disableDepthTest: true,
        alpha: 1,
        //size: 10,
        colorMix: 0,
        color: 0xff0000,
      }
      if(0) await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        Coordinates.ShapeFromArray(geometry,
              [[0,0,0],[0,0,0],[0,0,0]]).then(async res => {
          //res.cullFace = 'back'
          res.colorMix = 0
          res.alpha = .2
          res.shapeData.map((subShape, sIdx) => {
            switch(sIdx){
              case 0:
                subShape.yaw = 0
                subShape.pitch = 0
                subShape.roll = 0
              break
              case 1:
                subShape.yaw = 0
                subShape.pitch = 0
                subShape.roll = Math.PI/2
              break
              case 2:
                subShape.yaw = Math.PI/2
                subShape.pitch = 0
                subShape.roll = 0
              break
            }
          })
          shapes.push(res)
          await cursorBoundingShader.ConnectGeometry(res)

          var colors = res.shader.datasets[0].optionalAttributes[0].value
          var red, green, blue
          for(var i = 0; i < 3; i ++){
            switch(i){
              case 0:
                red   = 1
                green = 0
                blue  = 0
              break
              case 1:
                red   = 1
                green = 1
                blue  = 0
              break
              case 2:
                red   = 0
                green = 0
                blue  = 1
              break
            }
            for(var j = 0; j < res.stride; j ++){
              var idx = (j + i * res.stride) / 3 * 4
              colors[idx + 0] = red
              colors[idx + 1] = green
              colors[idx + 2] = blue
              colors[idx + 3] = 1
            }
          }

        })
        //shapes.push(geometry)
        //await cursorBoundingShader.ConnectGeometry(geometry)
      })

      
      
      var pointArray = []
      var rad = 100
      var iPc = 100
      Array(iPc).fill().map((v, i) => {
        var ls = Rn() ** .5 * rad
        if(0){
          x = S(p=Math.PI*2*Rn())*S(q=Rn()<.5?Math.PI/2*Rn()**.5:Math.PI-Math.PI/2*Rn()**.5) * ls
          y = C(q) * ls
          z = C(p) * S(q) * ls
        }else{
          x = 1e5
          y = 1e5
          z = 1e5
        }
        pointArray.push([x,y,z])
      })
      
      var blackholeDiskVerts
      var uvs = []
      var normals = []
      var vertices = []
      var normalVecs = []
      var ls = 2.6
      var sd = 10
      for(var i = 0; i < sd*9; i+=3){
        var j = i/3
        var x1 = S(p=Math.PI*2/sd*j + Math.PI/sd) * ls
        var y1 = C(p) * ls
        var z1 = 0
        var x2 = S(p=Math.PI*2/sd*(j+1) + Math.PI/sd) * ls
        var y2 = C(p) * ls
        var z2 = 0
        var x3 = 0
        var y3 = 0
        var z3 = 0
        vertices.push(x1,y1,z1, x2,y2,z2, x3,y3,z3)
        normalVecs.push(0,0,-1, 0,0,-1, 0,0,-1 )
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        normals.push(0,0,0, 0,0,-1)
        uvs.push(0,0,0,0,0,0)
      }
      
      var geometryData = {
        normalVecs,
        vertices,
        normals,
        uvs,
      }
      var geoOptions = {
        shapeType: 'custom shape',
        geometryData,
        name: 'blackhole disk',
        color: 0x000000,
        colorMix: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        for(var i = 0; i < geometry.vertices.length; i += 3){
          x = geometry.vertices[i+0]
          y = geometry.vertices[i+1]
          z = geometry.vertices[i+2]
          //geometry.vertices[i+0] = x - .1
          //geometry.vertices[i+1] = y + .1
          geometry.vertices[i+2] = z + .08
        }
        blackholeDiskVerts = structuredClone(geometry.vertices)
        Coordinates.ShapeFromArray(geometry, pointArray).then(async res => {
          shapes.push(res)
          await blackholeShader.ConnectGeometry(res)
        })
      })
      
      var lines = []
      var geometryData = []
      var linesShape
      Array(iLc).fill().map((v, i) => {
        geometryData.push([1e5,1e5,1e5],[1e5,1e5,1e5])
      })
      var geoOptions = {
        shapeType: 'lines',
        name: 'lines',
        geometryData,
        alpha: .5,
        penumbra: .33,
        size: 15,
        color: 0xff8800,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        linesShape = geometry
        await linesShader.ConnectGeometry(geometry)
      })

      var smoke
      var geoOptions = {
        shapeType: 'particles',
        name: 'smoke particles',
        geometryData: Array(iSmokec).fill().map(v=>[1e5,1e5,1e5]),
        alpha: 1,
        disableDepthTest: true,
        penumbra: .5,
        size: 5,
        color: 0xffbb88,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await particleShader.ConnectGeometry(geometry)
      })
      
      
      const SpawnSmoke = (x, y, z) => {
        var vx = S(p=Math.PI*2*Rn()) * S(q=Rn()<.5?Math.PI/2*Rn()**.5:Math.PI-Math.PI/2*Rn()**.5) * iSmokev
        var vy = C(q) * iSmokev
        var vz = C(p) * S(q) * iSmokev
        smoke.push({ x, y, z, vx, vy, vz, life: 1 })
      }

      /*
      var particles = []
      var geometryData = []
      var iParticlesc = 50
      var bars = 20
      var ls = 60
      var sp = ls/8
      for(j = 0; j < bars; j ++){
        Array(iParticlesc).fill().map((v, i) => {
          x = S(p=Math.PI*2/iParticlesc*i) * ls
          y = C(p) * ls
          z = (-bars/2 + j + .5) * sp
          var vx = 0
          var vy = 0
          var vz = 0
          geometryData.push([x,y,z])
          particles.push({ x, y, z, vx, vy, vz, ox: x, oy: y, oz: z })
        })
      }
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        geometryData,
        alpha: .8,
        penumbra: .33,
        size: 5,
        color: 0xff8800,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      */
      
      var cursor
      var geoOptions = {
        shapeType: 'sprite',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star6.png',
        name: 'cursor',
        size: 25,
        colorMix: 0,
        disableDepthTest: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        cursor = geometry
        shapes.push(geometry)
      })
      
      /*
      var geoOptions = {
        shapeType: 'octahedron',
        sphereize: 1,
        subs: 1,
        name: 'test marker',
        rotationMode: 2,
        size: 5,
        color: 0xff0000,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        await Coordinates.ShapeToLines(geometry).then(res => {
          res.shape.rotationMode = 2

           ori(renderer.pitch, 0)) ret = 'Z'

           ori(renderer.pitch, 0)) ret = 'X'
        if(ori(renderer.yaw, Math.PI) &&
           ori(renderer.pitch, 0)) ret = '-Z'
        if(ori(renderer.yaw, Math.PI * 1.5) &&
           ori(renderer.pitch, 0)) ret = '-X'
        if(ori(renderer.yaw, 0) &&
           ori(renderer.pitch, Math.PI/2)) ret = '-Y'

              var dx1 = (v.x - x1) 
              var dy1 = (v.y - y1)

              d = (d_=Math.hypot(dx1, dy1, dz1)) ** 2.5 / 10

              vy += dy1 / d * grav * v.mass
              vz += dz1 / d * grav * v.mass

            }

            break
            case 'particles':
              for(var i = 0; i < shape.vertices.length; i += 3){
                var j = i/3
                if(j < particles.length){
                  particles[j].vx += (particles[j].ox - particles[j].x) / homing
                  particles[j].vy += (particles[j].oy - particles[j].y) / homing
                  particles[j].vz += (particles[j].oz - particles[j].z) / homing
                  
                  var x1 = particles[j].x
                  var y1 = particles[j].y
                  var z1 = particles[j].z
                  blackholes.map((v, i) => {
                    if(v.x != 1e5){
                      var x2 = v.x
                      var y2 = v.y
                      var z2 = v.z
                      d = Math.hypot(x2-x1, y2-y1, z2-z1)**2
                      particles[j].vx += (x2-x1) / d * grav
                      particles[j].vy += (y2-y1) / d * grav
                      particles[j].vz += (z2-z1) / d * grav
                    }
                  })
                  
                  x = particles[j].x += particles[j].vx /= drag
                  y = particles[j].y += particles[j].vy /= drag
                  z = particles[j].z += particles[j].vz /= drag
                  shape.vertices[i+0] = x
                  shape.vertices[i+1] = y
                  shape.vertices[i+2] = z
                }else{
                  shape.vertices[i+0] = 1e5
                  shape.vertices[i+1] = 1e5
                  shape.vertices[i+2] = 1e5
                }
              }
              renderer.Draw(shape)
            break
            case 'blackhole':
              if(addingMass){
                if(massAvailable > 0) {
                  massAvailable -= 1
                  blackholes[bhIdx].mass += 1
                }
              }
              var disk = shapes.filter(v=>v.name =='blackhole disk')[0]
              for(var i = 0; i < disk.vertices.length; i += disk.stride){
                var sIdx = i/disk.stride
                var el = blackholes[i/disk.stride]
                if(el.x != 1e5){
                  var subShape = disk.shapeData[sIdx]
                  var ox = subShape.ox
                  var oy = subShape.oy
                  var oz = subShape.oz
                  var ls = (el.mass + 1) / 10
                  for(var j = 0; j < disk.stride; j +=3){
                    var idx = i + j
                    x = disk.vstate[idx+0] = blackholeDiskVerts[j+0] * ls + ox
                    y = disk.vstate[idx+1] = blackholeDiskVerts[j+1] * ls + oy
                    z = disk.vstate[idx+2]= blackholeDiskVerts[j+2] * ls + oz
                  }
                }
              }

              for(var i = 0; i < shape.vertices.length; i += shape.stride){
                var sIdx = i/shape.stride
                var el = blackholes[i/shape.stride]
                if(el.x != 1e5){
                  var subShape = shape.shapeData[sIdx]
                  var ox = subShape.ox
                  var oy = subShape.oy
                  var oz = subShape.oz
                  var ls = (el.mass + 1) / 10
                  for(var j = 0; j < shape.stride; j +=3){
                    var idx = i + j
                    x = shape.vstate[idx+0] = blackholeVerts[j+0] * ls + ox
                    y = shape.vstate[idx+1] = blackholeVerts[j+1] * ls + oy
                    z = shape.vstate[idx+2]= blackholeVerts[j+2] * ls + oz
                  }
                }
              }
              shape.shapeData.map((subShape, sIdx) => {
                subShape.x = blackholes[sIdx].x - subShape.ox
                subShape.y = blackholes[sIdx].y - subShape.oy
                subShape.z = blackholes[sIdx].z - subShape.oz

                subShape.pitch = (-renderer.pitch) * (renderer.cameraMode == 'fps' ? 1 : -1)
                subShape.yaw   = (-renderer.yaw) - shape.yaw
                subShape.roll += .005 * (sIdx %2 ? -1 : 1)
              })
              shape.rotationMode = 2
              
              //shape.yaw = t / 4
              renderer.Draw(shape)
            break
            case 'blackhole disk':
              shape.shapeData.map((subShape, sIdx) => {
                subShape.x = blackholes[sIdx].x - subShape.ox
                subShape.y = blackholes[sIdx].y - subShape.oy
                subShape.z = blackholes[sIdx].z - subShape.oz
                subShape.pitch = (-renderer.pitch) * (renderer.cameraMode == 'fps' ? 1 : -1)
                subShape.yaw   = (-renderer.yaw) - shape.yaw
                subShape.roll += .001 * (sIdx %2 ? -1 : 1)
              })
              shape.rotationMode = 2
            
              //shape.yaw = t / 4
              renderer.Draw(shape)
            break
            case 'lines':
              var colors = shape.shader.datasets[0].optionalAttributes[0].value
              for(var i = 0; i < shipSteps; i++){
                var x1 = ship.x
                var y1 = ship.y
                var z1 = ship.z
                var el = shapes.filter(v=>v.name=='ship')[0]
                var vx = ship.vx
                var vy = ship.vy
                var vz = ship.vz
                var ptch = -el.pitch
                var yw = el.yaw
                var collision = false
                for(var j = 0; j < shape.vertices.length; j += 6){
                  if(j < 6*predictiveLength){
                    var idx = j
                    if(!collision){
                      var ar = BlackholeFunc(x1, y1, z1, vx, vy, vz)
                      x1 = ar.x1
                      y1 = ar.y1
                      z1 = ar.z1
                      vx = ar.vx
                      vy = ar.vy
                      vz = ar.vz
                      if(ar.collision) collision = true
                      
                      var x2 = x1 + vx
                      var y2 = y1 + vy
                      var z2 = z1 + vz

                      x2 = x1 + vx
                      y2 = y1 + vy
                      z2 = z1 + vz
                      shape.vertices[idx+0] = -x1
                      shape.vertices[idx+1] = y1
                      shape.vertices[idx+2] = z1
                      shape.vertices[idx+3] = -x2
                      shape.vertices[idx+4] = y2
                      shape.vertices[idx+5] = z2
                      
                      x1 = x2
                      y1 = y2
                      z1 = z2
                      
                      d = Math.hypot(vx, vy, vz)
                      var rgb = Coordinates.HSVToRGB(d*20,d**2/2,.5+Math.min(.5,d**2/2))
                      var red = rgb[0] / 256
                      var green = rgb[1] / 256
                      var blue = rgb[2] / 256
                      for(var m = 2*3; m--;){
                        var idx2 = idx/6*8*3 + m*4
                        colors[idx2 + 0] = red
                        colors[idx2 + 1] = green
                        colors[idx2 + 2] = blue
                        colors[idx2 + 3] = 1
                      }
                    }else{
                      shape.vertices[idx+0] = 0
                      shape.vertices[idx+1] = 0
                      shape.vertices[idx+2] = 0
                      shape.vertices[idx+3] = 0
                      shape.vertices[idx+4] = 0
                      shape.vertices[idx+5] = 0
                    }
                  }
                }
              }
              renderer.Draw(shape)
            break
            case 'axis marker':
              if(AxisMarkersVisible()){
                  /*
                for(var i = 0;
                     i < shape.vertices.length;
                     i += shape.stride){
                  var ls = (t/2%1)*cbSize+1+i/shape.stride*cbSize
                  for(var j = 0; j < shape.stride; j += 3){
                    var idx = i + j
                    shape.vertices[idx+0] = shape.vstate[idx+0] = cbVerts[j + 0] * ls
                    shape.vertices[idx+1] = shape.vstate[idx+1] = cbVerts[j + 1] * ls
                    shape.vertices[idx+2] = shape.vstate[idx+2] = cbVerts[j + 2] * ls
                  }
                }
                */
                if(1)shape.shapeData.map((subShape, sIdx) => {
                  switch(sIdx){
                    case 0:
                      subShape.x = 0
                      subShape.y = Math.min(1e3,
                             Math.max(-1e3, cursor.y))
                      subShape.z =  Math.min(1e3,
                             Math.max(-1e3, cursor.z))
                    break
                    case 1:
                      subShape.x = Math.min(1e3,
                             Math.max(-1e3, cursor.x))
                      subShape.y = 0
                      subShape.z = Math.min(1e3,
                             Math.max(-1e3, cursor.z))
                    break
                    case 2:
                      subShape.x = Math.min(1e3,
                             Math.max(-1e3, cursor.x))
                      subShape.y = Math.min(1e3,
                             Math.max(-1e3, cursor.y))
                      subShape.z = 0
                    break
                  }
                })
                renderer.Draw(shape)
              }
            break
            case 'test marker':
              renderer.Draw(shape)
            break
            case 'ship':
              var shipDrag = 1.000001
              for(var i = 0; i < shipSteps; i++){
                if(launched){
                  if(alive){
                    var ar = BlackholeFunc(ship.x, ship.y, ship.z, ship.vx, ship.vy, ship.vz)
                    ship.x = ar.x1
                    ship.y = ar.y1
                    ship.z = ar.z1
                    ship.vx = ar.vx
                    ship.vy = ar.vy
                    ship.vz = ar.vz
                  }
                  var p1 = Math.atan2(ship.vx, ship.vz) + Math.PI
                  var p2 = -Math.acos(-ship.vy / (Math.hypot(ship.vx, ship.vy, ship.vz)+.00001)) + Math.PI/2
                  
                  shape.yaw = p1
                  shape.pitch = p2
                  
                  if(alive && launched){
                    shape.x = ship.x += ship.vx
                    shape.y = ship.y += ship.vy
                    shape.z = ship.z += ship.vz
                  }
                  ship.vx /= drag
                  ship.vy /= drag
                  ship.vz /= drag
                  if(ship.x > 1e3 || ship.x < -1e3 ||
                     ship.y > 1e3 || ship.y < -1e3 ||
                     ship.z > 1e3 || ship.z < -1e3){
                     alive = false
                     renderer.useKeys = false
                     //shipView = false
                  }
                  d = Math.hypot(ship.vx, ship.vy, ship.vz)
                  if(alive && d > .01 && Rn() < 1)
                    x = ship.vx / d * 15
                    y = ship.vy / d * 15
                    z = ship.vz / d * 15
                    for(var n=0; n<5; n++){
                      SpawnSmoke(
                                 ship.x - ship.vx/5*n - x,
                                 ship.y - ship.vy/5*n - y,
                                 ship.z - ship.vz/5*n - z )
                    }
                    
                  if(shipView){
                    var shipCamDist = 100
                    var shipCamTracking = 12
                    var vecx = 0
                    var vecy = 0
                    var vecz = shipCamDist
                    ship.vecPitch += shape.pitch - (ship.vecPitch) / shipCamTracking
                    p = Math.atan2(vecy, vecz) + shape.pitch + .5
                    d = Math.hypot(vecy, vecz)
                    vecy = S(p) * d
                    vecz = C(p) * d
                    ship.vecYaw += shape.yaw - (ship.vecYaw) / shipCamTracking
                    p = Math.atan2(vecx, vecz) + shape.yaw
                    d = Math.hypot(vecx, vecz)
                    vecx = S(p) * d
                    vecz = C(p) * d
                    ship.vecx += (vecx - ship.vecx) / shipCamTracking
                    ship.vecy += (vecy - ship.vecy) / shipCamTracking
                    ship.vecz += (vecz - ship.vecz) / shipCamTracking
                    renderer.x = -ship.x - ship.vecx
                    renderer.y = -ship.y - ship.vecy + 40
                    renderer.z = -ship.z - ship.vecz
                    renderer.yaw = -shape.yaw + Math.PI
                    renderer.pitch = shape.pitch
                  }
                }
              }
              renderer.Draw(shape)
            break
            case 'target':
              if(0){
                shape.shapeData.map((subShape, sIdx) => {
                  if(sIdx < targets.length){
                    subShape.x = targets[sIdx].x - subShape.ox
                    subShape.y = targets[sIdx].y - subShape.oy
                    subShape.z = targets[sIdx].z - subShape.oz
                  }else{
                    subShape.x = 1e5
                    subShape.y = 1e5
                    subShape.z = 1e5
                  }
                })
              }else{
                shape.x = targets[0].x
                shape.y = targets[0].y
                shape.z = targets[0].z
              }
              renderer.Draw(shape)
            break
            case 'cube grid':
              //if(!shipView) renderer.Draw(shape)
              renderer.Draw(shape)
            break
            case 'cursor':
              if(!launched && alive) renderer.Draw(shape)
            break
            case 'main':
              renderer.Draw(shape)
            break
            default:
              //renderer.Draw(shape)
            break
          }
        })
        
        if(misplaced.timer > t){
          misplacedShape.x = misplaced.x
          misplacedShape.y = misplaced.y
          misplacedShape.z = misplaced.z
          var diff = (misplaced.timer - t) * 2
          for(var i = 0; i < misplacedVerts.length; i+=3){
            misplacedShape.vertices[i+0] = misplacedVerts[i+0] * (2-diff)
            misplacedShape.vertices[i+1] = misplacedVerts[i+1] * (2-diff)
            misplacedShape.vertices[i+2] = misplacedVerts[i+2] * (2-diff)
          }
          misplacedShape.alpha = diff/2
          renderer.Draw(misplacedShape)
        }
        if(unDid) {
          bhIdx--
          unDid = false
        }
        
        //renderer.Draw(tempCube)
      }
      
    </script>
  </body>
</html>
